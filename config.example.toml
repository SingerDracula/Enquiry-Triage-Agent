# Copy this file to config.toml, then fill in only the providers you use.
# config.toml is ignored by Git: do not put credentials in this example file.
# Set current USD prices per million tokens for cost estimates. If both prices
# remain zero, evaluation reports cost as unavailable rather than free.
# For a genuinely free provider, set pricing_is_free = true explicitly.

[providers.gpt]
model = "your-gpt-model"
api_key = "replace_with_your_key"
# base_url = "https://api.openai.com/v1"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

[providers.deepseek]
model = "your-deepseek-model"
api_key = "replace_with_your_key"
base_url = "https://api.deepseek.com"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

[providers.gemini]
model = "your-gemini-model"
api_key = "replace_with_your_key"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

[providers.glm]
model = "glm-4.7-flash"
api_key = "replace_with_your_key"
# base_url = "https://open.bigmodel.cn/api/paas/v4"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

# OpenRouter Jev classifies only case_type and priority. The configured
# base provider still generates summary, draft_reply, and safety_status.
[providers.jev]
model = "typesafe/jev-1.13"
api_key = "replace_with_your_openrouter_api_key"
base_provider = "deepseek"
# base_url = "https://openrouter.ai/api/alpha"
timeout_seconds = 30
input_usd_per_million = 0.042
output_usd_per_million = 0
# If Jev is genuinely free, set both Jev prices to zero. The composite is only
# treated as free when base_provider also has pricing_is_free = true.
# pricing_is_free = true

# Optional OpenAI-compatible strict-JSON-Schema endpoint.
