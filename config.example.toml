# Copy this file to config.toml, then fill in only the providers you use.
# config.toml is ignored by Git: do not put credentials in this example file.
# Set current USD prices per million tokens for cost estimates. If both prices
# remain zero, evaluation reports cost as unavailable rather than free.
# For a genuinely free provider, set pricing_is_free = true explicitly.

[providers.gpt]
model = "your-gpt-model"
api_key = "replace_with_your_key"
# base_url = "https://api.openai.com/v1"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

[providers.deepseek]
model = "your-deepseek-model"
api_key = "replace_with_your_key"
base_url = "https://api.deepseek.com"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

[providers.gemini]
model = "your-gemini-model"
api_key = "replace_with_your_key"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

[providers.glm]
model = "glm-4.7-flash"
api_key = "replace_with_your_key"
# base_url = "https://open.bigmodel.cn/api/paas/v4"
input_usd_per_million = 0
output_usd_per_million = 0
# pricing_is_free = true

# Optional OpenAI-compatible strict-JSON-Schema endpoint.
#[providers.compatible]
#model = "your-compatible-model"
#api_key = "replace_with_your_key"
#base_url = "https://provider.example/v1"
